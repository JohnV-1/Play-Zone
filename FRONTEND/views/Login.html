<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Iniciar sesión | Play Zone</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../assets/Estilos.css">
        <link rel="stylesheet" href="../assets/David.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container-fluid gap-3 flex-wrap">
                <a class="navbar-brand" href="Home.html">Play Zone</a>
                <div class="d-flex gap-3 ms-auto align-items-center flex-wrap">
                    <a class="nav-link" href="Home.html">Catálogo</a>
                    <a class="nav-link" href="Clasificaciones.html">Clasificaciones</a>
                    <a class="nav-link" href="Perfil.html">Perfil</a>
                    <a class="nav-link" href="Administrar.html">Administrar</a>
                    <a class="btn btn-outline-light" href="Login.html">Iniciar sesión</a>
                </div>
            </div>
        </nav>
        <main class="container py-4">
            <section class="panel auth-panel">
                <h1 class="h2">Bienvenido de nuevo</h1>
                <p class="text-secondary">Inicia sesión para ver tus favoritos y puntuaciones.</p>
                <p class="demo-note">Prototipo de interfaces. Usa datos de ejemplo; el acceso real se integra en la siguiente entrega.</p>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input id="correo" type="email" class="form-control" placeholder="jugador@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input id="password" type="password" class="form-control" minlength="6" placeholder="Mínimo 6 caracteres" required>
                    </div>
                    <button class="btn btn-purple w-100">Iniciar sesión</button>
                </form>
                <p class="mt-4">¿No tienes cuenta? <a href="Registro.html">Regístrate</a>
                </p>
                <a href="Home.html">Jugar como invitado</a>
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="../controllers/prototipo.js"></script>
    </body>
</html>
