<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Administrar catálogo | Play Zone</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../assets/Estilos.css">
        <link rel="stylesheet" href="../assets/David.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container-fluid gap-3 flex-wrap">
                <a class="navbar-brand" href="Home.html">Play Zone</a>
                <div class="d-flex gap-3 ms-auto align-items-center flex-wrap">
                    <a class="nav-link" href="Home.html">Catálogo</a>
                    <a class="nav-link" href="Clasificaciones.html">Clasificaciones</a>
                    <a class="nav-link" href="Perfil.html">Perfil</a>
                    <a class="nav-link" href="Administrar.html">Administrar</a>
                    <a class="btn btn-outline-light" href="Login.html">Iniciar sesión</a>
                </div>
            </div>
        </nav>
        <main class="container py-4">
            <div class="d-flex justify-content-between flex-wrap gap-3 mb-4">
                <div>
                    <h1>Administrar catálogo</h1>
                    <p class="demo-note">Vista de administrador con datos de ejemplo. Se integrará el control de permisos en Backend.</p>
                </div>
                <button class="btn btn-purple align-self-center" data-bs-toggle="modal" data-bs-target="#juegoModal" id="nuevoJuego">Agregar juego</button>
            </div>
            <section class="panel">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Juego</th>
                                <th>Categoría</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="listaJuegos"></tbody>
                    </table>
                </div>
                <p id="estadoCatalogo" role="status"></p>
            </section>
            <div class="modal fade" id="juegoModal" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form id="juegoForm">
                            <div class="modal-header">
                                <h2 class="modal-title fs-5" id="tituloModal">Agregar juego</h2>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                            </div>
                            <div class="modal-body">
                                <label for="tituloJuego" class="form-label">Nombre</label>
                                <input id="tituloJuego" class="form-control mb-3" maxlength="50" required>
                                <label for="categoria" class="form-label">Categoría</label>
                                <select id="categoria" class="form-select">
                                    <option>Arcade</option>
                                    <option>Memoria</option>
                                    <option>Aventura</option>
                                </select>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn" data-bs-dismiss="modal">Cancelar</button>
                                <button class="btn btn-purple">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="modal fade" id="eliminarJuegoModal" tabindex="-1" aria-labelledby="tituloEliminarJuego" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2 id="tituloEliminarJuego" class="modal-title fs-5">Eliminar juego</h2>
                            <button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">¿Quieres quitar este juego del catálogo de demostración?</div>
                        <div class="modal-footer">
                            <button class="btn" data-bs-dismiss="modal">Cancelar</button>
                            <button class="btn btn-danger" id="confirmarEliminarJuego">Eliminar</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="../controllers/prototipo.js"></script>
        <script src="../controllers/catalogo.js"></script>
    </body>
</html>
